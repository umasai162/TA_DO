services:
  - type: web
    name: todo-app
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt && npm --prefix frontend install && VITE_API_URL=/ npm --prefix frontend run build
    startCommand: cd backend && gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOWED_ORIGINS
        value: https://todo-app-yfby.onrender.com,http://localhost:3000,http://localhost:5173
